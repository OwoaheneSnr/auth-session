services:
  auth_db:
    image: docker.io/library/postgres:16
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${USERNAME_DB}
      POSTGRES_PASSWORD: ${PASSWORD_DB}
      POSTGRES_DB: ${NAME_DB}
    ports:
      - "${PORT_DB:-5432}:5432"
    volumes:
      - ./db/data:/var/lib/postgresql/data
